<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>商途 Merchant Road</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="seal">商</span>
        <div>
          <h1>商途</h1>
          <p class="sub">Merchant Road · v0.1</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="map-panel" id="mapPanel" aria-label="商路地圖">
      <svg class="iso-map" viewBox="0 0 360 220" role="img">
        <defs>
          <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5eb3c4"/>
            <stop offset="100%" stop-color="#2f6f82"/>
          </linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d9c48a"/>
            <stop offset="100%" stop-color="#b8955a"/>
          </linearGradient>
        </defs>
        <ellipse cx="180" cy="118" rx="150" ry="78" fill="url(#water)" opacity="0.35"/>
        <path id="route-hq" d="M90 150 Q160 100 230 70" class="route"/>
        <path id="route-qn" d="M230 70 Q280 110 300 155" class="route"/>
        <path id="route-hn" d="M90 150 Q200 175 300 155" class="route long"/>
        <!-- isometric city pads -->
        <g class="city-pad" data-city="hekou" transform="translate(70,130)">
          <polygon points="0,-18 36,0 0,18 -36,0" fill="#c45c26"/>
          <polygon points="0,-18 36,0 0,8 -36,0" fill="#e07a3a"/>
          <text y="36" text-anchor="middle">河口鎮</text>
        </g>
        <g class="city-pad" data-city="qingshan" transform="translate(230,55)">
          <polygon points="0,-18 36,0 0,18 -36,0" fill="#3d7a4a"/>
          <polygon points="0,-18 36,0 0,8 -36,0" fill="#5a9e68"/>
          <text y="36" text-anchor="middle">青山驛</text>
        </g>
        <g class="city-pad" data-city="nanpu" transform="translate(300,140)">
          <polygon points="0,-18 36,0 0,18 -36,0" fill="#3a6ea5"/>
          <polygon points="0,-18 36,0 0,8 -36,0" fill="#5b8fc4"/>
          <text y="36" text-anchor="middle">南浦港</text>
        </g>
        <circle id="playerToken" r="7" fill="#d4a017" stroke="#1a1a1a" stroke-width="2"/>
      </svg>
      <p class="hint" id="locationHint"></p>
    </section>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="market">市集</button>
      <button type="button" class="tab" data-tab="travel">上路</button>
      <button type="button" class="tab" data-tab="cart">貨艙</button>
      <button type="button" class="tab" data-tab="log">流水</button>
    </nav>

    <main>
      <section id="tab-market" class="tab-pane active"></section>
      <section id="tab-travel" class="tab-pane"></section>
      <section id="tab-cart" class="tab-pane"></section>
      <section id="tab-log" class="tab-pane"></section>
    </main>

    <footer class="bar">
      <button type="button" id="btnSave" class="ghost">儲存</button>
      <button type="button" id="btnReset" class="ghost danger">重新開始</button>
      <span class="foot-note">原創致敬 · 非官方作品</span>
    </footer>
  </div>

  <!-- Bargain modal -->
  <dialog id="bargainDlg">
    <form method="dialog" id="bargainForm">
      <h2 id="bargainTitle">議價</h2>
      <p id="bargainNpc" class="npc-line"></p>
      <p id="bargainMeta" class="meta"></p>
      <div class="price-row">
        <button type="button" id="bidMinus" class="chip">−</button>
        <input type="number" id="bidInput" min="1" step="1" />
        <button type="button" id="bidPlus" class="chip">＋</button>
      </div>
      <div class="dlg-actions">
        <button type="button" id="bidOffer" class="primary">出價</button>
        <button type="button" id="bidAcceptCounter" class="primary" hidden>接受還價</button>
        <button type="button" value="cancel" class="ghost">離開</button>
      </div>
    </form>
  </dialog>

  <!-- Event / win toast -->
  <dialog id="eventDlg">
    <form method="dialog">
      <h2 id="eventTitle">路上</h2>
      <p id="eventBody"></p>
      <button value="ok" class="primary">知道了</button>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
