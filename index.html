<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2830" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>商途 Merchant Road</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="seal" aria-hidden="true">商</span>
        <div>
          <h1>商途</h1>
          <p class="sub">Merchant Road · v0.2</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <section class="map-panel" id="mapPanel" aria-label="商路地圖">
      <div class="map-frame">
        <svg class="iso-map" viewBox="0 0 380 240" role="img" aria-label="三鎮商路">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7eb8d4"/>
              <stop offset="55%" stop-color="#c5e0c8"/>
              <stop offset="100%" stop-color="#9bb890"/>
            </linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4a9bb8"/>
              <stop offset="100%" stop-color="#2a6a80"/>
            </linearGradient>
            <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#8b7355"/>
              <stop offset="50%" stop-color="#c4a574"/>
              <stop offset="100%" stop-color="#8b7355"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.35"/>
            </filter>
            <pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse">
              <rect width="12" height="12" fill="#8fbc7a"/>
              <circle cx="3" cy="4" r="1.2" fill="#7aaa68" opacity="0.5"/>
              <circle cx="9" cy="8" r="1" fill="#a0d088" opacity="0.4"/>
            </pattern>
          </defs>

          <!-- sky / land -->
          <rect width="380" height="240" fill="url(#sky)"/>
          <!-- distant hills -->
          <ellipse cx="60" cy="95" rx="55" ry="22" fill="#6a9a6e" opacity="0.55"/>
          <ellipse cx="200" cy="78" rx="70" ry="26" fill="#5a8a62" opacity="0.5"/>
          <ellipse cx="330" cy="100" rx="50" ry="20" fill="#6a9a6e" opacity="0.45"/>

          <!-- water body -->
          <ellipse cx="95" cy="175" rx="70" ry="32" fill="url(#water)" opacity="0.9"/>
          <ellipse cx="95" cy="175" rx="55" ry="18" fill="#6ec4d8" opacity="0.25" class="water-shimmer"/>
          <!-- pier sticks -->
          <g opacity="0.7">
            <rect x="55" y="168" width="3" height="14" fill="#5a4030"/>
            <rect x="72" y="172" width="3" height="12" fill="#5a4030"/>
            <rect x="90" y="170" width="3" height="13" fill="#5a4030"/>
          </g>

          <!-- ground plate -->
          <ellipse cx="200" cy="155" rx="165" ry="72" fill="url(#grass)" opacity="0.85"/>

          <!-- roads -->
          <path id="route-hq" d="M95 155 Q165 105 235 75" fill="none" stroke="url(#roadGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
          <path d="M95 155 Q165 105 235 75" fill="none" stroke="#e8d4a8" stroke-width="3" stroke-dasharray="5 7" opacity="0.7"/>
          <path id="route-qn" d="M235 75 Q285 115 310 160" fill="none" stroke="url(#roadGrad)" stroke-width="10" stroke-linecap="round"/>
          <path d="M235 75 Q285 115 310 160" fill="none" stroke="#e8d4a8" stroke-width="3" stroke-dasharray="5 7" opacity="0.7"/>
          <path id="route-hn" d="M95 155 Q210 185 310 160" fill="none" stroke="url(#roadGrad)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
          <path d="M95 155 Q210 185 310 160" fill="none" stroke="#e8d4a8" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.55"/>

          <!-- trees (decorative) -->
          <g class="trees" filter="url(#softShadow)">
            <g transform="translate(145,120)"><ellipse cx="0" cy="-8" rx="10" ry="12" fill="#2d6b3a"/><rect x="-2" y="0" width="4" height="8" fill="#5a3a20"/></g>
            <g transform="translate(175,95)"><ellipse cx="0" cy="-7" rx="8" ry="10" fill="#358045"/><rect x="-2" y="0" width="3" height="7" fill="#5a3a20"/></g>
            <g transform="translate(260,130)"><ellipse cx="0" cy="-9" rx="11" ry="13" fill="#2a6540"/><rect x="-2" y="0" width="4" height="8" fill="#5a3a20"/></g>
            <g transform="translate(40,120)"><ellipse cx="0" cy="-6" rx="7" ry="9" fill="#3a7a48"/><rect x="-1.5" y="0" width="3" height="6" fill="#5a3a20"/></g>
          </g>

          <!-- CITY: 河口鎮 — riverside brick -->
          <g class="city-pad" data-city="hekou" transform="translate(95,145)" filter="url(#softShadow)">
            <polygon points="0,22 42,0 0,-22 -42,0" fill="#8b4518"/>
            <polygon points="0,-22 42,0 42,8 0,-14" fill="#c45c26"/>
            <polygon points="0,-22 -42,0 -42,8 0,-14" fill="#a04820"/>
            <!-- building -->
            <g transform="translate(0,-28)">
              <polygon points="0,-16 18,0 0,8 -18,0" fill="#e8c89a"/>
              <polygon points="0,-16 18,0 18,6 0,-10" fill="#d4a574"/>
              <polygon points="-18,0 0,8 0,14 -18,6" fill="#b8955a"/>
              <rect x="-4" y="-2" width="5" height="8" fill="#3a2010"/>
              <polygon points="0,-20 14,-6 -14,-6" fill="#b01e2e"/>
            </g>
            <!-- flag -->
            <g transform="translate(16,-48)">
              <line x1="0" y1="0" x2="0" y2="18" stroke="#3a2010" stroke-width="1.5"/>
              <polygon points="0,0 12,4 0,8" fill="#c45c26" class="flag-wave"/>
            </g>
            <text y="38" text-anchor="middle" class="city-label">河口鎮</text>
          </g>

          <!-- CITY: 青山驛 — green hills -->
          <g class="city-pad" data-city="qingshan" transform="translate(235,68)" filter="url(#softShadow)">
            <polygon points="0,22 42,0 0,-22 -42,0" fill="#2d5a35"/>
            <polygon points="0,-22 42,0 42,8 0,-14" fill="#3d7a4a"/>
            <polygon points="0,-22 -42,0 -42,8 0,-14" fill="#2f6b3a"/>
            <g transform="translate(0,-26)">
              <polygon points="0,-14 16,0 0,8 -16,0" fill="#efe0b8"/>
              <polygon points="0,-14 16,0 16,5 0,-9" fill="#d9c48a"/>
              <polygon points="-16,0 0,8 0,13 -16,5" fill="#b8955a"/>
              <rect x="-3" y="0" width="4" height="7" fill="#2a1810"/>
              <!-- roof tiles hint -->
              <polygon points="0,-18 12,-6 -12,-6" fill="#3d7a4a"/>
            </g>
            <g transform="translate(-18,-42)">
              <ellipse cx="0" cy="0" rx="8" ry="10" fill="#2d6b3a"/>
              <ellipse cx="6" cy="2" rx="6" ry="8" fill="#358045"/>
            </g>
            <text y="38" text-anchor="middle" class="city-label">青山驛</text>
          </g>

          <!-- CITY: 南浦港 — blue harbor -->
          <g class="city-pad" data-city="nanpu" transform="translate(310,152)" filter="url(#softShadow)">
            <polygon points="0,22 42,0 0,-22 -42,0" fill="#1e4a6e"/>
            <polygon points="0,-22 42,0 42,8 0,-14" fill="#3a6ea5"/>
            <polygon points="0,-22 -42,0 -42,8 0,-14" fill="#2a5580"/>
            <g transform="translate(0,-28)">
              <polygon points="0,-14 16,0 0,8 -16,0" fill="#dce8f0"/>
              <polygon points="0,-14 16,0 16,5 0,-9" fill="#b0c8d8"/>
              <polygon points="-16,0 0,8 0,13 -16,5" fill="#7a9ab0"/>
              <rect x="-3" y="0" width="4" height="7" fill="#1a2830"/>
              <polygon points="0,-18 12,-6 -12,-6" fill="#3a6ea5"/>
            </g>
            <!-- boat -->
            <g transform="translate(28,8)">
              <ellipse cx="0" cy="4" rx="14" ry="4" fill="#2a4050"/>
              <path d="M-12,2 Q0,-6 12,2 L8,6 L-8,6 Z" fill="#c45c26"/>
              <line x1="0" y1="-6" x2="0" y2="4" stroke="#efe0b8" stroke-width="1.5"/>
              <polygon points="0,-6 8,0 0,2" fill="#f4e4c1" class="sail-sway"/>
            </g>
            <text y="38" text-anchor="middle" class="city-label">南浦港</text>
          </g>

          <!-- player cart token -->
          <g id="playerCart" transform="translate(95,145)">
            <g class="cart-bob">
              <ellipse cx="0" cy="6" rx="14" ry="5" fill="#000" opacity="0.25"/>
              <!-- cart body -->
              <rect x="-12" y="-6" width="20" height="10" rx="2" fill="#8b5a2b"/>
              <rect x="-12" y="-10" width="20" height="5" rx="1" fill="#a67c3d"/>
              <circle cx="-8" cy="6" r="4" fill="#2a1810"/>
              <circle cx="6" cy="6" r="4" fill="#2a1810"/>
              <circle cx="-8" cy="6" r="1.5" fill="#d4a017"/>
              <circle cx="6" cy="6" r="1.5" fill="#d4a017"/>
              <!-- crate -->
              <rect x="-6" y="-16" width="10" height="7" fill="#d4a017" stroke="#5a3a10" stroke-width="0.8"/>
              <!-- merchant silhouette -->
              <circle cx="10" cy="-12" r="4" fill="#f0d5b0"/>
              <rect x="7" y="-8" width="6" height="8" rx="1" fill="#b01e2e"/>
              <polygon points="6,-16 10,-20 14,-16" fill="#1a1a1a"/>
            </g>
          </g>
        </svg>
      </div>
      <p class="hint" id="locationHint"></p>
    </section>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="market" role="tab">市集</button>
      <button type="button" class="tab" data-tab="travel" role="tab">上路</button>
      <button type="button" class="tab" data-tab="cart" role="tab">貨艙</button>
      <button type="button" class="tab" data-tab="more" role="tab">更多</button>
    </nav>

    <main>
      <section id="tab-market" class="tab-pane active"></section>
      <section id="tab-travel" class="tab-pane"></section>
      <section id="tab-cart" class="tab-pane"></section>
      <section id="tab-more" class="tab-pane"></section>
    </main>

    <footer class="bar">
      <button type="button" id="btnSave" class="ghost">儲存</button>
      <button type="button" id="btnReset" class="ghost danger">重新開始</button>
      <span class="foot-note">原創致敬 · 非官方</span>
    </footer>
  </div>

  <!-- Bargain modal -->
  <dialog id="bargainDlg">
    <form method="dialog" id="bargainForm">
      <div class="bargain-head">
        <div class="npc-portrait" id="npcPortrait" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <circle cx="32" cy="32" r="30" fill="#3a8ea8"/>
            <ellipse cx="32" cy="38" rx="18" ry="16" fill="#f0d5b0"/>
            <circle cx="32" cy="24" r="12" fill="#f0d5b0"/>
            <ellipse cx="32" cy="16" rx="14" ry="8" fill="#1a1a1a"/>
            <circle cx="26" cy="24" r="2" fill="#1a1a1a"/>
            <circle cx="38" cy="24" r="2" fill="#1a1a1a"/>
            <path d="M26 30 Q32 34 38 30" fill="none" stroke="#c45c26" stroke-width="1.5"/>
            <rect x="22" y="42" width="20" height="16" fill="#b01e2e"/>
          </svg>
        </div>
        <div>
          <h2 id="bargainTitle">議價</h2>
          <p id="bargainNpc" class="npc-line"></p>
        </div>
      </div>
      <p id="bargainMeta" class="meta"></p>
      <div class="price-row">
        <button type="button" id="bidMinus" class="chip">−</button>
        <input type="number" id="bidInput" min="1" step="1" inputmode="numeric" />
        <button type="button" id="bidPlus" class="chip">＋</button>
      </div>
      <div class="dlg-actions">
        <button type="button" id="bidOffer" class="primary">出價</button>
        <button type="button" id="bidAcceptCounter" class="primary" hidden>接受還價</button>
        <button type="button" value="cancel" class="ghost">離開</button>
      </div>
    </form>
  </dialog>

  <!-- Bandit / combat lite -->
  <dialog id="banditDlg">
    <form method="dialog">
      <div class="bandit-art" aria-hidden="true">
        <svg viewBox="0 0 120 70" width="100%" height="70">
          <rect width="120" height="70" fill="#2a1810" rx="8"/>
          <ellipse cx="60" cy="58" rx="40" ry="8" fill="#000" opacity="0.3"/>
          <!-- bandit -->
          <circle cx="45" cy="28" r="10" fill="#c4a070"/>
          <rect x="38" y="36" width="14" height="16" fill="#4a3020"/>
          <polygon points="35,20 45,10 55,20" fill="#1a1a1a"/>
          <line x1="52" y1="40" x2="70" y2="28" stroke="#888" stroke-width="3"/>
          <!-- cart -->
          <rect x="78" y="36" width="22" height="12" fill="#8b5a2b"/>
          <circle cx="82" cy="50" r="4" fill="#2a1810"/>
          <circle cx="96" cy="50" r="4" fill="#2a1810"/>
        </svg>
      </div>
      <h2 id="banditTitle">綠林響馬</h2>
      <p id="banditBody"></p>
      <div class="hp-row" id="banditHpRow" hidden>
        <span>你 <strong id="playerHpLabel">—</strong></span>
        <span>匪 <strong id="banditHpLabel">—</strong></span>
      </div>
      <div class="dlg-actions" id="banditActions">
        <button type="button" id="btnFight" class="primary">硬拼</button>
        <button type="button" id="btnPay" class="ghost">交過路費</button>
        <button type="button" id="btnFlee" class="ghost">落荒而逃</button>
      </div>
      <div class="dlg-actions" id="banditContinue" hidden>
        <button type="button" id="btnBanditOk" class="primary">繼續上路</button>
      </div>
    </form>
  </dialog>

  <!-- Generic event -->
  <dialog id="eventDlg">
    <form method="dialog">
      <h2 id="eventTitle">路上</h2>
      <p id="eventBody"></p>
      <button value="ok" class="primary">知道了</button>
    </form>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
